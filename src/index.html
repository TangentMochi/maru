<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maru</title>
    <link rel="stylesheet" href="vendor/98.css" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>

  <body>
    <div id="terminal">
      <div class="titlebar">Maru</div>

      <div class="funcbar">
        <div id="function-keys" class="function-keys"></div>
        <div id="mode-keys" class="mode-keys"></div>
      </div>

      <div class="subbar">
        <output class="tab-name"></output>
        <output class="tab-name"></output>
        <output class="tab-name"></output>
        <output class="tab-name"></output>
        <span class="spacer"></span>
        <button type="button" id="abort" disabled>中止</button>
        <button type="button" id="send">発信</button>
      </div>

      <div class="work">
        <div class="left">
          <section class="panel request-head">
            <output id="request-name" class="name-box"></output>
            <button type="button" id="side-menu">ｻｲﾄﾞﾒﾆｭｰ</button>
          </section>

          <section id="form-view" class="panel form-view"></section>
        </div>

        <section class="panel right">
          <div class="tabs">
            <button type="button" class="tab" data-mode="full">フルキー</button>
            <button type="button" class="tab" data-mode="number">数字入力</button>
          </div>
          <div id="key-grid" class="key-grid"></div>

          <div id="response-view" class="response-view" hidden>
            <div class="panel verdict-row">
              <output id="verdict" class="verdict"></output>
              <output id="status-code" class="name-box"></output>
              <output id="response-message" class="name-box"></output>
            </div>
            <pre id="response-body" class="response-body"></pre>
          </div>
        </section>
      </div>

      <div class="statusbar">
        <output id="progress" class="progress">準備完了</output>
        <output id="status-message" class="name-box"></output>
      </div>
    </div>

    <div id="registry" class="window registry" hidden></div>
  </body>
</html>
